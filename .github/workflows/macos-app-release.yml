# Native macOS (Apple Silicon, arm64) RELEASE build of the JUCE GUI
# application. The bundle is uploaded as a downloadable CI artifact so the
# owner can validate a macOS build without a local Xcode/CMake setup.
#
# On main, the bundle is also attached to the commit's alpha pre-release —
# the same release the Windows and Debug workflows publish into, so one
# release page carries every platform/configuration for a given commit.
# [RQ-BLD-011, RQ-BLD-013, ADR-BLD-002]
#
# arm64 is pinned explicitly rather than inherited from whatever macos-latest
# happens to resolve to, so the scope decision is visible here.
# [ADR-BLD-002 DEC-BLD-007]
#
# Note for whoever downloads the artifact: the bundle is not notarized, so
# Gatekeeper will quarantine it after download. Clear it with
# `xattr -dr com.apple.quarantine Xplorer.app` (or right-click -> Open).
#
# Naming: workflow file, workflow name and job name are all
# `macos-app-release` — os-application-build, matching
# `linux-headless-release`, `windows-app-release` and `windows-app-debug`.
# One build configuration per workflow. [RQ-BLD-010]
name: macos-app-release

on:
  push:
    paths: ['juce/**', '.github/workflows/macos-app-release.yml']
  pull_request:
    paths: ['juce/**', '.github/workflows/macos-app-release.yml']

permissions:
  contents: write   # required to publish into the main-branch alpha release [RQ-BLD-013]

jobs:
  macos-app-release:
    name: Build Xplorer.app (arm64, Release)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + tags: the alpha tag and notes are derived from them

      # Default (single-config) generator, so the configuration is chosen here
      # with CMAKE_BUILD_TYPE — not with --build/--config as on Windows'
      # multi-config Visual Studio generator.
      - name: Configure (arm64, GUI app, Release)
        run: >
          cmake -S juce -B juce/build-mac
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DXPL_BUILD_APP=ON -DXPL_BUILD_TESTS=ON

      - name: Build (Release)
        run: cmake --build juce/build-mac -j"$(sysctl -n hw.ncpu)"

      - name: Run unit tests
        run: ctest --test-dir juce/build-mac --output-on-failure

      # Located rather than hard-coded: JUCE places the bundle under
      # <target>_artefacts/<config>/, and that layout is JUCE's to change.
      - name: Locate the produced bundle
        run: |
          APP=$(find juce/build-mac -maxdepth 6 -type d -name 'Xplorer.app' | head -n 1)
          if [ -z "$APP" ]; then echo "Xplorer.app was not produced" >&2; exit 1; fi
          echo "Built: $APP"
          test -x "$APP/Contents/MacOS/Xplorer" || { echo "bundle has no executable" >&2; exit 1; }
          echo "XPLORER_APP=$APP" >> "$GITHUB_ENV"

      # ditto (not zip/tar) because it is the macOS-native archiver that keeps
      # bundle symlinks and permission bits intact through the round trip.
      - name: Package the bundle
        run: ditto -c -k --sequesterRsrc --keepParent "$XPLORER_APP" Xplorer-macos-arm64.zip

      - name: Upload macOS bundle (arm64)
        uses: actions/upload-artifact@v4
        with:
          name: Xplorer-macos-arm64
          path: Xplorer-macos-arm64.zip
          if-no-files-found: error

      # ---- main-branch alpha pre-release [RQ-BLD-013] -----------------------
      - name: Publish into the shared alpha pre-release
        if: github.ref == 'refs/heads/main'
        uses: ./.github/actions/alpha-prerelease
        with:
          asset: Xplorer-macos-arm64.zip
          asset-name: Xplorer-macos-arm64-release.zip
          token: ${{ secrets.GITHUB_TOKEN }}
