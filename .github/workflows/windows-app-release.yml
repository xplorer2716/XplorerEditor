# Native Windows (MSVC, x64) RELEASE build of the JUCE GUI application. JUCE
# does not support MinGW (juce_TargetPlatform.h #errors on it), so the amd64
# binary is produced here with the Visual Studio toolchain and uploaded as an
# artifact the owner can download and validate. [RQ-BLD-002, RQ-BLD-004, RQ-GUI]
#
# Naming: workflow file, workflow name and job name are all
# `windows-app-release` — os-application-build, matching
# `linux-headless-release` and `windows-app-debug`. One build configuration per
# workflow, so a file name always names exactly one job.
#
# Tests run by default on push / pull_request. To build only the binary
# without tests, trigger the workflow manually (Actions -> windows-app-release
# -> "Run workflow") and untick "Build and run the unit tests".
#
# On main only, a successful build is additionally published as a GitHub
# Release marked pre-release (alpha preview, never "Latest"), so testers
# always have a current build without it being mistaken for a production
# release. That release is shared with the macOS and Debug build workflows —
# one release per commit, carrying every platform/configuration binary.
# [RQ-BLD-009, RQ-BLD-013, ADR-BLD-001, ADR-BLD-002]
name: windows-app-release

on:
  push:
    paths: ['juce/**', '.github/workflows/windows-app-release.yml']
  pull_request:
    paths: ['juce/**', '.github/workflows/windows-app-release.yml']
  workflow_dispatch:
    inputs:
      run_tests:
        description: 'Build and run the unit tests'
        type: boolean
        default: true

env:
  # 'true' on push/PR (inputs unset) and on a dispatch with the box ticked;
  # only an explicit manual "false" turns tests off.
  RUN_TESTS: ${{ github.event.inputs.run_tests != 'false' }}

permissions:
  contents: write   # required to publish the main-branch alpha release [RQ-BLD-009]

jobs:
  windows-app-release:
    name: Build Xplorer.exe (x64, Release)
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + tags, needed to find the previous alpha tag

      - name: Configure (MSVC, x64, GUI app)
        run: >
          cmake -S juce -B juce/build-win -G "Visual Studio 17 2022" -A x64
          -DXPL_BUILD_APP=ON -DXPL_BUILD_TESTS=${{ env.RUN_TESTS == 'true' && 'ON' || 'OFF' }}

      - name: Build (Release)
        run: cmake --build juce/build-win --config Release -j

      - name: Run unit tests
        if: env.RUN_TESTS == 'true'
        run: ctest --test-dir juce/build-win --build-config Release --output-on-failure

      - name: Locate the produced binary
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Filter Xplorer.exe juce/build-win |
                 Select-Object -First 1
          if (-not $exe) { throw "Xplorer.exe was not produced" }
          Write-Host "Built: $($exe.FullName)"
          & $exe.FullName --version 2>$null; # smoke: image loads (may no-op)
          "XPLORER_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload Windows binary (amd64)
        uses: actions/upload-artifact@v4
        with:
          name: Xplorer-win-x64
          path: ${{ env.XPLORER_EXE }}
          if-no-files-found: error

      # ---- main-branch alpha pre-release [RQ-BLD-009, RQ-BLD-013] -----------
      # One release per commit, shared with the three other build workflows;
      # the tag derivation lives in the action so all four agree on it.
      - name: Publish into the shared alpha pre-release
        if: github.ref == 'refs/heads/main'
        uses: ./.github/actions/alpha-prerelease
        with:
          asset: ${{ env.XPLORER_EXE }}
          asset-name: Xplorer-windows-x64-release.exe
          token: ${{ secrets.GITHUB_TOKEN }}
