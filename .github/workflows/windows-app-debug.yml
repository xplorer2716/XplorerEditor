# Native Windows (MSVC, x64) DEBUG build of the JUCE GUI application, for the
# two things the Release workflow cannot cover:
#
#  1. the development-only code paths (`#if JUCE_DEBUG`) are never compiled in
#     a Release build, so a compile error inside one — such as the RQ-GUI-048
#     start-up fit check — would go unnoticed until someone builds Debug;
#  2. the combo-box fit promise of RQ-GUI-047 is only as good as the text
#     metrics of the platform it is measured on, and every other CI job
#     measures on Linux.
#
# Note what this workflow does NOT rely on: `jassert` only breaks when a
# debugger is attached and otherwise just logs, so merely launching the app in
# Debug would pass even with a label that overflows. The real gate is
# `xpl_tests_app_juce`, which measures the shipped labels with the embedded
# face and fails the run. [RQ-GUI-047, RQ-GUI-048, RQ-DSN-096, ADR-JUC-022]
#
# Naming: workflow file, workflow name and job name are all
# `windows-app-debug` — os-application-build, matching
# `linux-headless-release` and `windows-app-release`.
name: windows-app-debug

on:
  push:
    paths: ['juce/**', '.github/workflows/windows-app-debug.yml']
  pull_request:
    paths: ['juce/**', '.github/workflows/windows-app-debug.yml']

permissions:
  contents: write   # required to publish into the main-branch alpha release [RQ-BLD-013]

jobs:
  windows-app-debug:
    name: Debug build + real-metrics checks (x64)
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + tags: the alpha tag and notes are derived from them

      - name: Configure (MSVC, x64, GUI app, Debug)
        run: >
          cmake -S juce -B juce/build-win-debug -G "Visual Studio 17 2022" -A x64
          -DXPL_BUILD_APP=ON -DXPL_BUILD_TESTS=ON

      - name: Build (Debug)
        run: cmake --build juce/build-win-debug --config Debug -j

      - name: Run unit tests (Debug, incl. real-metrics combo-box fit)
        run: ctest --test-dir juce/build-win-debug --build-config Debug --output-on-failure

      - name: Locate the produced binary
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Filter Xplorer.exe juce/build-win-debug |
                 Select-Object -First 1
          if (-not $exe) { throw "Xplorer.exe was not produced" }
          Write-Host "Built: $($exe.FullName)"
          "XPLORER_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload Windows Debug binary (amd64)
        uses: actions/upload-artifact@v4
        with:
          name: Xplorer-win-x64-debug
          path: ${{ env.XPLORER_EXE }}
          if-no-files-found: error

      # ---- main-branch alpha pre-release [RQ-BLD-013] -----------------------
      # Debug binaries ship alongside the Release ones so a tester hitting a
      # bug can rerun on a build that logs its assertions instead of silently
      # continuing — that is the whole reason this configuration exists.
      - name: Publish into the shared alpha pre-release
        if: github.ref == 'refs/heads/main'
        uses: ./.github/actions/alpha-prerelease
        with:
          asset: ${{ env.XPLORER_EXE }}
          asset-name: Xplorer-windows-x64-debug.exe
          token: ${{ secrets.GITHUB_TOKEN }}
