# CI for the JUCE (C++) port: headless build + tests of the non-UI layers, in
# Release config.
#
# Naming: workflow file, workflow name and job name are all
# `linux-headless-release`. One build configuration per workflow, so a file name
# always names exactly one job. [RQ-BLD-007]
# DELIBERATELY OUTSIDE the <os>-<arch>-<config>-<stage> deployment naming scheme
# of RQ-BLD-023, and not generated by juce/tools/generate_workflows.py.
#
# It builds no application and deploys nothing: it is the non-UI test job of
# RQ-BLD-007, which is why it has neither an architecture nor a stream to put in
# a name. Renaming it to fit a deployment nomenclature would state something
# false about it. [RQ-BLD-007, RQ-BLD-023]
#
# Manual only (owner decision, 2026-08-16, during the canary/preprod trigger
# review): no push or pull_request trigger, so it never overlaps or duplicates
# the generated fifteen. Run it by hand from the Actions tab.
#
# That decision briefly left Linux with no automatic coverage at all, because
# this was then the only Linux job. TASK-BLD-006 has since added the five
# `linux-x64-*` deployment workflows, which build the GUI application on every
# push — so what this one still adds is the HEADLESS configuration
# (XPL_BUILD_APP=OFF): proof that the non-UI layers keep compiling and passing
# without a GUI toolchain present. [RQ-BLD-007, RQ-BLD-025]
name: linux-headless-release

on:
  workflow_dispatch:

jobs:
  linux-headless-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ALSA headers (juce_audio_devices)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Configure
        run: cmake -S juce -B juce/build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build juce/build -j"$(nproc)"

      - name: Test
        run: ctest --test-dir juce/build --output-on-failure
