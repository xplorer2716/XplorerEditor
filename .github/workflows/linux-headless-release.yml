# CI for the JUCE (C++) port: headless build + tests of the non-UI layers, in
# Release config. Named to stay consistent with juce-windows.yml's
# windows-app / windows-app-debug jobs: this is the Linux counterpart of the
# Release job, distinct from any future Debug/macOS job. [RQ-BLD-007]
name: linux-headless-release

on:
  push:
    paths: ['juce/**', '.github/workflows/linux-headless-release.yml']
  pull_request:
    paths: ['juce/**', '.github/workflows/linux-headless-release.yml']

jobs:
  linux-headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ALSA headers (juce_audio_devices)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Configure
        run: cmake -S juce -B juce/build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build juce/build -j"$(nproc)"

      - name: Test
        run: ctest --test-dir juce/build --output-on-failure
