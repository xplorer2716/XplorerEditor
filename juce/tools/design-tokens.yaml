    # control surface in this application. RQ-GUI-025, RQ-GUI-057, ADR-ABT-001.
    black:     { kind: colour, hex: "000000", note: "juce::Colours::black" }
    grey:      { kind: colour, hex: "808080", note: "juce::Colours::grey" }
    lightGrey: { kind: colour, hex: "D3D3D3", note: "juce::Colours::lightgrey" }
    linkBlue:  { kind: colour, hex: "0000FF", note: "juce::Colours::blue — hyperlink text on a light surface" }

    # ---- MIDI-activity LED hues (MainComponent LedPanelComponent) ----
    ledGreen: { kind: colour, hex: "90FF90", note: "fromRGB(144,255,144) — automation in" }
    ledBlue:  { kind: colour, hex: "5CABFF", note: "fromRGB(92,171,255) — synth in" }
    ledRed:   { kind: colour, hex: "FF4020", note: "fromRGB(255,64,32) — synth out" }

    # ---- vector-background palette (BackgroundRenderer, ADR-JUC-013) ----
    frame:     { kind: colour, hex: "B7BDD0", note: "block frames / signal lines" }
    title:     { kind: colour, hex: "F2F2F6", note: "bold block/section titles" }
    caption:   { kind: colour, hex: "C9CACE", note: "parameter captions" }
    plateTop:  { kind: colour, hex: "45464F", note: "brushed-metal gradient stops" }
    plateHi:   { kind: colour, hex: "3B3C44" }
    plateMid:  { kind: colour, hex: "36363E", note: "== slate400 today; kept independent" }
    plateBot:  { kind: colour, hex: "303138" }
    wood0:     { kind: colour, hex: "4A1D08", note: "side-rail wood gradient stops" }
    wood1:     { kind: colour, hex: "7C3615" }
    wood2:     { kind: colour, hex: "8A431C" }
    wood3:     { kind: colour, hex: "6B2C0F" }
    wood4:     { kind: colour, hex: "38160A" }
    woodGrain: { kind: colour, hex: "2E1206", note: "wood grain hairlines" }
    barTop:    { kind: colour, hex: "3050B8", note: "section underline gradient" }
    barMid:    { kind: colour, hex: "24388A" }
    barBot:    { kind: colour, hex: "1A2A66" }

    # ---- type scale (point sizes; one entry per distinct value in use) ----
    fs16:  { kind: float, value: 16.0 }
    fs15:  { kind: float, value: 15.0 }
    fs14:  { kind: float, value: 14.0 }
    fs135: { kind: float, value: 13.5 }
    fs13:  { kind: float, value: 13.0 }
    fs125: { kind: float, value: 12.5 }
    fs12:  { kind: float, value: 12.0 }
    fs115: { kind: float, value: 11.5 }
    fs11:  { kind: float, value: 11.0 }
    fs9:   { kind: float, value: 9.0 }

    # ---- geometry (appearance: corner radius / stroke width, in px) ----
    radius20: { kind: float, value: 2.0 }
    radius15: { kind: float, value: 1.5 }
    stroke10: { kind: float, value: 1.0 }
    stroke15: { kind: float, value: 1.5, note: "every stroke of the background diagram — block frames, signal lines, control sub-panel frames. Thicker than the button/control frame (stroke10), thinner than the former uniform diagram width (stroke20), RQ-GUI-051" }
    stroke20: { kind: float, value: 2.0 }
    stroke24: { kind: float, value: 2.4 }
    indicatorSize: { kind: int, value: 7, note: "MIDI LED lamp diameter. FIRST VERSION (owner, 2026-08-04, RQ-GUI-056): 7 px is provisional and expected to be retuned after visual review -- which is why it is a token and no longer a LED_SIZE constant. Three independent ceilings, all satisfied: <= 10 (twice the 5 px .NET reference, owner allowance), < 14 (the check-box indicator, so a read-only lamp can never be mistaken for a control), <= 8 (three lamps plus spacing must fit the extracted 32x8 _ledPanelControl bounds -- the binding limit). ADR-JUC-031 (DEC-JUC-096)" }

    # ---- motion / timing ----
    hoverBrightenFactor: { kind: float, value: 0.4, note: "knob ring hover brighten" }
    tickBoxBorderAlpha:  { kind: float, value: 0.6, note: "tick-box border vs accent" }
    indicatorHoldMs:     { kind: int,   value: 100, note: "MIDI LED retriggerable hold" }
    indicatorGlowAlpha:  { kind: float, value: 0.55, note: "peak opacity of the radial glow at a lit MIDI LED's centre, fading to fully transparent at its outer edge. Below the accent hover brighten (0.4 is a colour delta, this is an alpha) and deliberately under 1.0: a glow that reaches full opacity reads as a second, larger lamp rather than as light around the first. ADR-JUC-031 (DEC-JUC-095)" }
    indicatorGlowRadius: { kind: float, value: 2.0,  note: "glow outer radius as a MULTIPLE of the lamp's own radius (indicatorSize/2), not of its diameter -- at 2.0 the glow reaches exactly one lamp-radius past the visible dot's edge (3.5 px at the 7 px first version), so retuning indicatorSize scales the halo with it. Checked against the real clearance around _ledPanelControl (11 px to the VFD glass, 14+ px to the button row): a diameter-multiple reading would have reached 14 px and left only 0.5 px before touching the glass -- deliberately kept well inside instead. Also sets how far LedPanelComponent inflates its painting bounds past the extracted panel rect, since the 8 px-high panel has no room for a halo (DEC-JUC-097). ADR-JUC-031 (DEC-JUC-095)" }
    knobTrackAlpha:      { kind: float, value: 0.2, note: "owner review 2026-07: reference's literal 5/255 read as invisible once combined with our transparent knob body (ADR-JUC-009) -- at minimum value the knob had no visible shape at all. Raised to a clearly-visible-but-subtle wash." }
    disabledAlpha:       { kind: float, value: 0.5, note: "owner-confirmed 2026-07: shared Disabled treatment for check boxes/radios/combos (RQ-DSN-032, TASK-JUC-109/110, ADR-JUC-017)" }

    # ---- spacing (layout grid, in px; base unit 4 -- audited from every
    #      hand-authored dialog layout call in SettingsDialog.cpp and
    #      ProgressWindow.cpp: every recurring gap/margin literal already
    #      divides evenly into this grid. Value-preserving, owner-approved
    #      2026-07. TASK-JUC-098, RQ-DSN-020. ----
    space2:  { kind: int, value: 2,  note: "hairline inset — row.reduced(0,2), swatch.reduced(2)" }
    space4:  { kind: int, value: 4,  note: "xs gap — pre-automation-table gap" }
    space6:  { kind: int, value: 6,  note: "sm gap — inter-section gaps, label/bar gap" }
    space8:  { kind: int, value: 8,  note: "md gap — inter-button gaps" }
    space12: { kind: int, value: 12, note: "lg gap — dialog outer margin" }
    space24: { kind: int, value: 24, note: "xl gap — progress bar height" }

    # ---- dialog component sizes (content-driven, not on the spacing scale) ----
    dialogRowHeight:  { kind: int, value: 28,  note: "SettingsDialog/ProgressWindow row height" }
    dialogLabelWidth: { kind: int, value: 150, note: "SettingsDialog label column width, sized to the longest existing label" }
    # ---- Randomizer page: VCO2/Matrix checkbox columns, shared across both
    #      rows so a checkbox aligns with its counterpart on the row below.
    #      Owner report 2026-08-15: FM/Amount aligned by accident (same start
    #      x), Noise/Quantize and Sync/source & dest. did not, because each
    #      row picked its own per-checkbox width. RQ-GUI-069, ADR-JUC-033. ----
    dialogRandomizerCol1Width: { kind: int, value: 90,  note: "FM / Amount column — sized to 'Amount', the wider of the pair" }
    dialogRandomizerCol2Width: { kind: int, value: 100, note: "Noise / Quantize column — sized to 'Quantize', the wider of the pair" }
    dialogRandomizerCol3Width: { kind: int, value: 130, note: "Sync / source & dest. column — sized to 'source & dest.' (shortened from 'Sources & destinations' in the same change, RQ-GUI-069), the wider of the pair" }
    # ---- settings COLOURS/KNOB BEHAVIOUR groups (owner-validated mockup,
    #      2026-07-26). RQ-GUI-046, ADR-JUC-020. ----
    dialogSwatchWidth:     { kind: int, value: 40,  note: "colour swatch cell width (value-preserving: the pre-existing knob-LED swatch literal)" }
    dialogChooseWidth:     { kind: int, value: 100, note: "uniform 'Choose...' button width (mockup: all colour buttons identical)" }
    dialogBlockLabelWidth: { kind: int, value: 90,  note: "block-name label width in the 2x4 colour grid (sized to 'MOD MATRIX')" }
    dialogResetWidth:      { kind: int, value: 140, note: "'Reset to defaults' button width" }
    dialogGroupHeaderHeight: { kind: int, value: 16, note: "vertical clearance under a GroupComponent title before the first row" }
    # ---- MIDI automation table column layout (RQ-GUI-060, ADR-JUC-012 DEC-JUC-104) ----
    midiCcColumnMinWidth: { kind: int, value: 240, note: "minimum width of the automation table's 'MIDI CC' column; value-preserving from its pre-existing fixed width. The column stretches above this floor to fill the dialog (setStretchToFitActive), so the 'Parameter' column's dialogLabelWidth never grows -- there is no unconstrained/dead header area left over." }
    # ---- Go to patch / Store spinner control (RQ-GUI-058) ----
    patchSpinnerWidth:        { kind: int, value: 92, note: "overall juce::Slider(IncDecButtons) width. 80 widened +15% (owner visual review 2026-08-05: narrow field hurt readability)" }
    patchSpinnerTextBoxWidth: { kind: int, value: 69, note: "text-entry portion width, scaled +15% with patchSpinnerWidth (60->69) to keep the button-zone proportion; the remaining 23px button zone is still narrower than dialogRowHeight so JUCE stacks +/- vertically (juce_Slider.cpp resizeIncDecButtons: sideBySide iff width > height)" }
    patchSpinnerRowWidth:     { kind: int, value: 300, note: "width of the invisible row Component the spinner is centred inside. AlertWindow::updateLayout always places a custom component at proportionOfWidth(0.1f) and never resizes it, and sizes the whole dialog to at least componentWidth/0.8 (juce_AlertWindow.cpp) -- so a row wide enough to be that dominant term ends up spanning exactly the dialog's 10%..90% content column, which reads as centred. Owner visual review 2026-08-05: the bare 92px spinner sat flush-left instead." }
    # ---- combo-box text metrics (RQ-GUI-047, ADR-JUC-022). The size is a
    #      design decision, not a computed value; the arrow/border values
    #      reclaim the 40px LookAndFeel_V4 reserves for far taller controls
    #      than our 21px combos, which is what lets the fixed size fit the
    #      reference widths unchanged. ----
    comboTextSize:    { kind: float, value: 12.0, note: "one fixed size for every combo box; measured to fit every label of every value list in the embedded face with >=9.9px to spare (RQ-GUI-047)" }
    comboArrowZone:   { kind: int, value: 20, note: "arrow zone width, replacing LookAndFeel_V4's 30px (DEC-JUC-047)" }
    comboLabelBorder: { kind: int, value: 2,  note: "combo Label left/right border, replacing juce::Label's default 5px (DEC-JUC-047)" }

    # ---- functional-block identity palette v2 (owner-selected "option B",
    #      2026-07): one hue per signal-path block so the panel reads as
    #      grouped areas. Chromatic blocks share OKLCh L=0.67 / C=0.100 for
    #      coherence; LAG stays achromatic; MATRIX is the Oberheim-signature
    #      blue exception (L0.62/C0.175/H273). Min pairwise CIEDE2000 15.2,
    #      all >= 3.0:1 WCAG 1.4.11 contrast on the plate — methodology,
    #      metrics and superseded v1 values in RQ-DSN §2.1b. Colour only --
    #      no geometry impact. RQ-DSN-092/093, RQ-GUI-044. ----
    blockVco:    { kind: colour, hex: "549ECB", note: "VCO1 / VCO2 / FM group (v2, H238)" }
    blockLag:    { kind: colour, hex: "8F969D", note: "LAG (achromatic)" }
    blockTrack:  { kind: colour, hex: "B19047", note: "TRACK / tracking generator (v2)" }
    blockVcf:    { kind: colour, hex: "7AA364", note: "VCF / VCA (v2)" }
    blockEnv:    { kind: colour, hex: "C88160", note: "envelope generator (v2)" }
    blockLfo:    { kind: colour, hex: "A087C9", note: "LFO (v2)" }
    blockRamp:   { kind: colour, hex: "37A9A3", note: "RAMP (v2)" }
    blockMatrix: { kind: colour, hex: "6579EE", note: "modulation matrix — Oberheim-signature blue (v2, L0.62/C0.175/H273)" }
    sectionBarFadeEnd: { kind: float, value: 0.35, note: "section-bar opacity at the far end; 1.0 at the label end (RQ-GUI-037 'bright at the label end' preserved with the block hue)" }
    sectionBarHeight:  { kind: float, value: 4.5,  note: "section separator bar thickness. Was a bare constant in BackgroundRenderer.cpp and a literal in the mockup generator; promoted to a token by RQ-GUI-062, which made it load-bearing for the header's vertical layout (the label baseline now sits on the bar's bottom edge, so this value positions the text as well as sizing the bar)" }
    sectionLabelGap:   { kind: int,   value: 8,    note: "blank plate on EACH side of a section label, separating it from the lead-in stub before it and the rule after it. RQ-GUI-062" }
    sectionLeadStub:   { kind: int,   value: 16,   note: "short rule drawn BEFORE a section label, so the separator reads as running into the label the way the Xpander's silkscreen does rather than starting after it (owner request). ~1.5 average cap advances at textTitle (0.70em x 15 + 0.5 letter-spacing = 11px). ONE fixed length for every section, not 1.5 of each label's own characters: a per-label stub would leave each section starting at a different x and break the column's left alignment. RQ-GUI-062" }
    sectionGapAbove:   { kind: int,   value: 16,   note: "vertical rhythm of the canvas sections: canvas px between the BOTTOM of a section lowest visible element and the label baseline of that section separator bar. The bar is a TERMINATOR - its label names the section that just ended (ADR-JUC-034 DEC-JUC-107) - so it must sit closer to its own section than to the next one; this token is the closer half of that relation, sectionGapBelowMin the other. RQ-CLR-001, ADR-CLR-001 (DEC-CLR-001-B). Value 16, on the 4px base unit of RQ-DSN-020. DEVIATION from the owner mockup, which measured 20 (median of seven hand-placed bars): 20 does not fit the centre column budget - between the VCF group bottom and the RAMP X baseline, 633 px hold 508 px of incompressible group height, leaving (125 - 4*gap)/3 per below-gap, so gap must stay under 17.9 for sectionGapBelowMin > sectionGapAbove to hold. At 20 the centre column keeps the very inversion this rhythm exists to remove. Owner reviewed both values rendered from the real screenshot and chose 16. Raising this above 17 will fail SectionRhythmTests" }
    sectionGapBelowMin: { kind: int,  value: 20,   note: "floor for the gap between a separator label baseline and the TOP of the next section first visible element. A floor, not a fixed value: each column leftover space is divided evenly among its below-gaps (RQ-CLR-004), and the two columns have very different leftovers (~45 px per gap on the left, ~20 in the centre) because they hold different amounts of content between the same two anchors. What must hold everywhere is the RELATION sectionGapBelowMin > sectionGapAbove - that is what makes the bar read as belonging to the section above it. RQ-CLR-002, ADR-CLR-001 (DEC-CLR-001-B)" }
    shortcutButtonSize: { kind: int,  value: 27,   note: "side of a shortcut key, canvas px. NOT a free choice: RQ-GUI-065 requires the row of eight to span the modulation grid - from the left edge of the MOD_SRC combo column to the right edge of the MOD_QUANTIZE tick-box column, the very span the MOD MATRIX separator already takes (RQ-CLR-007). That is 258 px, and 8*27 + 7*6 = 258 is the only sensible integer solution for eight squares with equal gaps (8*20 + 7*14 also closes, with gutters wider than the keys). Row and separator now derive from ONE grid instead of two references. ADR-GUI-001 (DEC-GUI-001-D)" }
    shortcutButtonGap:  { kind: int,  value: 6,    note: "gap between two shortcut keys - the other half of the 8*27 + 7*6 = 258 solution above. RQ-GUI-065" }
    shortcutButtonGapAbove: { kind: int, value: 8, note: "from the MIDI LED strip bottom down to the key row. Small on purpose: the buttons belong to the display group (ADR-JUC-024) so they bind upward to it, and the larger remainder falls below, separating them from the matrix. Same proximity principle as RQ-CLR-001, applied to a group instead of a section. RQ-GUI-065" }
    shortcutIconStroke: { kind: float, value: 1.35, note: "icon outline width, canvas px. Thinner than strokeDiagram (2.0): these glyphs sit inside a 29 px key and a diagram-weight line closes their counters. Owner review 2026-08-10 took it down from 1.7. RQ-GUI-064" }
    shortcutButtonBorderAlpha: { kind: float, value: 0.65, note: "key outline vs the frame colour. At full opacity eight adjacent outlines pulled more attention than the modulation matrix beside them; 0.65 matches the restraint of tickBoxBorderAlpha. RQ-GUI-063" }
    blockFillAlpha:    { kind: float, value: 0.30, note: "tinted block fill: block hue at this alpha over the panel plate. Originally 0.18, measured from the owner-supplied modernisation mockup (fill #443326 on plate #242528 for block #C27A52), RQ-DSN-094; raised to 0.30 (owner decision, after 0.24 was reviewed in the mockup and judged too subtle) so the block background reads less transparent and the block is easier to identify, RQ-GUI-051 — deviation from the measured mockup value, recorded here per the design-system deviation rule." }
    blockFrameRelief:  { kind: float, value: 0.2,  note: "block frame relief: JUCE Colour::darker() amount applied to the BOTTOM edge of the frame gradient, top edge stays the pure block hue (mockup ratio bottom/top = 0.84). RQ-DSN-094" }

    # ---- dialog title-bar icons (Settings/About/Dependencies, RQ-GUI-070) ----
    dialogIconAccent: { kind: colour, hex: "66B5E3", note: "static badge colour for OS-native title-bar icons — these cannot live-retheme (set once at DialogWindow::setIcon() time, the window is native chrome outside the app's own LookAndFeel), so this deliberately mirrors DEFAULT_KNOB_COLOR (juce/settings/src/AllUsersSettingsDefaults.cpp) rather than the live, user-customisable ledColour(): the app's own shipped-default identity colour, not a runtime value. A future change to DEFAULT_KNOB_COLOR does not have to update this token, and vice versa — the two are independently owned, deliberately duplicated values, not a shared source of truth." }
    dialogIconSize:   { kind: int, value: 32, note: "pixel size of the rendered title-bar icon image; the OS scales down for taskbar/alt-tab as needed. RQ-GUI-070" }

    # ---- main-panel control-row height (MainForm-extracted; shared by check
    #      boxes / radios / in-panel stacked rows so paired rows align) ----
    controlRowHeight: { kind: int, value: 17, note: "reference control-row height (check box / radio button); BoundRadioGroup rows use it so radios align with sibling check boxes. TASK-JUC-108, RQ-GUI-040" }

    # ---- VFD 16-segment display (RQ-GUI-033, RQ-DSN-097, ADR-JUC-023) ----
    # DERIVED, not hand-picked: juce/tools/fit_vfd_tokens.py fits these against
    # the baseline sheet juce/app/assets/vfd-matrix.png and reaches RMSE
    # 25.81/255 over the 51 glyphs that sheet draws. Re-derive with `--fit`;
    # `--check` scores the values below and fails past its budget.
    #
    # Every length is a fraction of the glyph cell WIDTH — y included. The cell
    # is 12x16, so normalised y runs 0..4/3 rather than 0..1: that keeps the
    # unit cell isotropic so the renderer applies ONE uniform scale and round
    # glow stays round. Normalising the two axes independently would read
    # tidier and draw wrong.
    vfdPhosphor:     { kind: colour, hex: "00FFA1", note: "phosphor hue; red stays 0 through the halo and only rises once the core clips, so this is the whole colour of the display" }
    vfdSegLeft:      { kind: float, value: 0.28713, note: "left segment rail" }
    vfdSegRight:     { kind: float, value: 0.75083, note: "right segment rail" }
    vfdSegTop:       { kind: float, value: 0.11833, note: "top segment rail" }
    vfdSegBottom:    { kind: float, value: 0.96333, note: "bottom segment rail; also the pivot the italic shear rotates about" }
    vfdSegStroke:    { kind: float, value: 0.09583, note: "segment thickness" }
    vfdSegGap:       { kind: float, value: 0.03222, note: "shortening at each segment end, so adjacent segments read as separate" }
    vfdSegSlant:     { kind: float, value: 0.13267, note: "italic shear, x per unit y; dimensionless, so it does not scale" }
    vfdGlowRadius:   { kind: float, value: 0.17906, note: "glow sigma. MUST be multiplied by the render scale (DEC-JUC-053) or the halo shrinks visually as the window grows" }
    vfdGlowAmount:   { kind: float, value: 1.23067, note: "glow amplitude added over the core; one Gaussian, not two — see DEC-JUC-054 for why the second was refused" }
    vfdUnlitLevel:   { kind: float, value: 0.08627, note: "always-drawn unlit segment bed. MEASURED off the baseline's blank cell, not fitted: left free it trades against the glow and parks on its bound, over-brightening the bed" }
    vfdWhiteLift:    { kind: float, value: 0.43333, note: "how fast the core washes toward white once the phosphor hue clips past 1.0" }

    # ---- off-model primitives (DEC-JUC-052) ----
    # ':' is two separated dots and '_' a bar BELOW the glyph body. No
    # combination of the 16 segments produces either, so both get an explicit
    # primitive — and ':' is not decoration, it appears in every NAME:VALUE and
    # every "MIDI CC:" line the display shows.
    #
    # MEASURED off the baseline's own cells by `fit_vfd_tokens.py --extras`; no
    # optimisation, just bright-pixel centroids. Both colon dots sit at the same
    # x there: un-sheared that leaves 0.53 px between them, exactly the shear a
    # hand-drawn 12-px-wide cell could not express. Stored upright, sheared by
    # the renderer like every other shape.
    vfdDotX:         { kind: float, value: 0.31404, note: "colon dot centre, upright — the renderer applies the shear" }
    vfdDotSize:      { kind: float, value: 0.18634, note: "colon dot side" }
    vfdDotUpperY:    { kind: float, value: 0.40000, note: "upper colon dot centre" }
    vfdDotLowerY:    { kind: float, value: 0.73333, note: "lower colon dot centre" }
    vfdUnderscoreY:  { kind: float, value: 1.00000, note: "underscore bar centre; sits BELOW the bottom rail, which is precisely why no segment can express it" }

    # ---- VFD bezel (RQ-GUI-050, RQ-DSN-098, ADR-JUC-024) ----
    # CHOSEN, not measured — and that distinction matters here. The RQ-DSN-097
    # values above were fitted against vfd-matrix.png; these have no baseline at
    # all, because the .NET display had no bezel. fit_vfd_tokens.py is therefore
    # NOT extended to them (DEC-JUC-061): deriving them would fabricate a
    # provenance. Tune them by eye against the approved mockup.
    #
    # Lengths are LOGICAL pixels, not cell fractions: the bezel is panel
    # furniture drawn in canvas coordinates, unlike the glyph geometry which had
    # to be cell-relative to survive rescaling.
    vfdBezelMarginV:     { kind: int,   value: 6,    note: "band thickness above and below the glass" }
    vfdBezelMarginH:     { kind: int,   value: 4,    note: "band thickness left and right. DELIBERATELY thinner than the vertical one (DEC-JUC-060): at 6 the mockup crowded the modulation matrix on the right while having air above" }
    vfdBezelInnerShadow: { kind: float, value: 0.75, note: "alpha of the shadow the band casts onto the glass edge — the cue that the glass sits BELOW the band" }
    vfdBezelInnerWidth:  { kind: float, value: 3.0,  note: "width of that inner shadow" }
    vfdBezelRimDark:     { kind: float, value: 0.5,  note: "alpha of the dark hairline on the bezel's TOP outer edge" }
    vfdBezelRimLight:    { kind: float, value: 0.18, note: "alpha of the light hairline on the BOTTOM outer edge. Dark-top/light-bottom is the inverse of the raised-plate relief (RQ-DSN-094) — under light from above that inversion IS the difference between a recess and a bump, so the two must never converge" }

  # -------------------------------------------------------------------
  # TIER 2 — SEMANTIC : roles aliasing globals. Components reference these.
  # -------------------------------------------------------------------
  semantic:

    # ---- colour roles: surfaces / borders ----
    surfaceBase:     { alias: global.slate900, note: "dialogs, progress, tick-box fill" }
    surfaceRecessed: { alias: global.slate800, note: "combo/popup/tab/list-row/mod-matrix" }
    surfaceSelected: { alias: global.slate600, note: "selected list row" }
    controlTrack:    { alias: global.white, note: "knob unlit ring track base (with component.knobTrackAlpha)" }
    borderDefault:   { alias: global.slate500, note: "dialog list cell separator" }

    # ---- colour roles: light "document" surfaces (About / Dependencies) ----
    # The one family of windows that is light rather than slate: they present
    # legal/attribution text, not controls. RQ-GUI-025, RQ-GUI-057, ADR-ABT-001.
    surfaceDocument:     { alias: global.white,     note: "About / Dependencies window background (reference AboutForm.BackColor)" }
    textOnDocument:      { alias: global.black,     note: "primary text on a document surface" }
    textOnDocumentMuted: { alias: global.grey,      note: "secondary text on a document surface (licence notice, column headers)" }
    documentSeparator:   { alias: global.lightGrey, note: "hairline rule on a document surface" }
    surfaceDocumentControl: { alias: global.lightGrey, note: "control fill on a document surface (About > Dependencies button) — without it a TextButton inherits the dark application scheme and reads as a black slab on the white About form" }
    textLink:            { alias: global.linkBlue,  note: "hyperlink text on a document surface" }

    # ---- colour roles: indicators (RQ-GUI-022) ----
    indicatorOffFill:    { alias: global.slate400 }
    indicatorOffBorder:  { alias: global.slate350 }
    indicatorAutomation: { alias: global.ledGreen }
    indicatorSynthIn:    { alias: global.ledBlue }
    indicatorSynthOut:   { alias: global.ledRed }

    # ---- colour roles: text ----
    textPrimary: { alias: global.white }

    # ---- colour roles: vector panel / diagram (ADR-JUC-013) ----
    diagramFrame:   { alias: global.frame }
    diagramTitle:   { alias: global.title }
    diagramCaption: { alias: global.caption }
    panelPlateTop:  { alias: global.plateTop }
    panelPlateHi:   { alias: global.plateHi }
    panelPlateMid:  { alias: global.plateMid }
    panelPlateBot:  { alias: global.plateBot }
    panelWood0:     { alias: global.wood0 }
    panelWood1:     { alias: global.wood1 }
    panelWood2:     { alias: global.wood2 }
    panelWood3:     { alias: global.wood3 }
    panelWood4:     { alias: global.wood4 }
    panelWoodGrain: { alias: global.woodGrain }
    sectionBarTop:  { alias: global.barTop }
    sectionBarMid:  { alias: global.barMid }
    sectionBarBot:  { alias: global.barBot }

    # ---- colour roles: functional-block identity (RQ-DSN-092/093, RQ-GUI-044).
    #      Consumed by block frames, section labels and section bars; anything
    #      outside an identified block keeps diagramFrame. ----
    blockVco:    { alias: global.blockVco }
    blockLag:    { alias: global.blockLag }
    blockTrack:  { alias: global.blockTrack }
    blockVcf:    { alias: global.blockVcf }
    blockEnv:    { alias: global.blockEnv }
    blockLfo:    { alias: global.blockLfo }
    blockRamp:   { alias: global.blockRamp }
    blockMatrix: { alias: global.blockMatrix }

    # ---- type roles: every distinct size kept (consolidation deferred, RQ-DSN-010) ----
    textDisplay:  { alias: global.fs16,  note: "VCO1/VCO2, combo base size" }
    textTitle:    { alias: global.fs15,  note: "section titles" }
    textSubtitle: { alias: global.fs14,  note: "MIX/LAG/LFO/RAMP, settings table" }
    textLabel:    { alias: global.fs135, note: "wide block labels" }
    textLabelAlt: { alias: global.fs13,  note: "VCA / VCA1" }
    textBody:     { alias: global.fs125, note: "PWM" }
    textCaption:  { alias: global.fs12,  note: "parameter captions, toggle caption" }
    textWave:     { alias: global.fs115, note: "TRIANGLE/SAWTOOTH/PULSE" }
    textSmall:    { alias: global.fs11,  note: "IN/OUT labels" }
    textDense:    { alias: global.fs9,   note: "DESTINATION/TRIGGER/NOISE, combo floor" }

    # ---- geometry roles ----
    radiusControl:      { alias: global.radius20, note: "tick box outer, block corner" }
    radiusControlInner: { alias: global.radius15, note: "tick box checked fill" }
    strokeBorder:       { alias: global.stroke10, note: "tick box border" }
    strokeDiagram:      { alias: global.stroke15, note: "EVERY stroke of the background diagram: labelled block frames, signal lines and neutral control sub-panel frames, deliberately one single width so the diagram reads as one drawing (owner decision, RQ-GUI-051)" }
    strokeLine:         { alias: global.stroke20, note: "control-widget strokes: combo-box arrow, page-family selector outline. No longer used by the background diagram — that moved to strokeDiagram (RQ-GUI-051). No longer used for a focus ring either — RQ-GUI-054 removed the keyboard-focus indicator (and the strokeFocusRing role it briefly had) on 2026-08-04" }
    strokeKnobRing:     { alias: global.stroke24, note: "knob track + value arc" }

    # ---- motion roles ----
    hoverBrighten:   { alias: global.hoverBrightenFactor }
    indicatorHoldMs: { alias: global.indicatorHoldMs }

    # ---- layout roles (dialogs; TASK-JUC-098, RQ-DSN-020) ----
    layoutHairline:   { alias: global.space2,  note: "SettingsDialog row/swatch fine inset" }
    layoutFieldGap:   { alias: global.space4,  note: "SettingsDialog pre-table gap" }
    layoutSectionGap: { alias: global.space6,  note: "SettingsDialog section gaps, ProgressWindow label/bar gap" }
    layoutButtonGap:  { alias: global.space8,  note: "SettingsDialog/ProgressWindow inter-button gap" }
    layoutMargin:     { alias: global.space12, note: "dialog outer margin" }
    dialogRowHeight:  { alias: global.dialogRowHeight }
    dialogLabelWidth: { alias: global.dialogLabelWidth }
    dialogSwatchWidth:     { alias: global.dialogSwatchWidth,     note: "settings colour-swatch width, RQ-GUI-046" }
    dialogChooseWidth:     { alias: global.dialogChooseWidth,     note: "uniform Choose... button width, RQ-GUI-046" }
    dialogBlockLabelWidth: { alias: global.dialogBlockLabelWidth, note: "block label width in the colour grid, RQ-GUI-046" }
    dialogResetWidth:      { alias: global.dialogResetWidth,      note: "Reset to defaults button width, RQ-GUI-046" }
    dialogGroupHeaderHeight: { alias: global.dialogGroupHeaderHeight, note: "group-title clearance, RQ-GUI-046" }
    midiCcColumnMinWidth: { alias: global.midiCcColumnMinWidth, note: "automation table 'MIDI CC' column floor width, RQ-GUI-060" }
    dialogRandomizerCol1Width: { alias: global.dialogRandomizerCol1Width, note: "FM / Amount column, RQ-GUI-069" }
    dialogRandomizerCol2Width: { alias: global.dialogRandomizerCol2Width, note: "Noise / Quantize column, RQ-GUI-069" }
    dialogRandomizerCol3Width: { alias: global.dialogRandomizerCol3Width, note: "Sync / source & dest. column, RQ-GUI-069" }
    patchSpinnerWidth:        { alias: global.patchSpinnerWidth,        note: "Go to patch / Store spinner width, RQ-GUI-058" }
    patchSpinnerTextBoxWidth: { alias: global.patchSpinnerTextBoxWidth, note: "Go to patch / Store spinner text-box width, RQ-GUI-058" }
    patchSpinnerRowWidth:     { alias: global.patchSpinnerRowWidth,     note: "Go to patch / Store spinner centring-row width, RQ-GUI-058" }
    comboTextSize:    { alias: global.comboTextSize,    note: "fixed combo-box text size, RQ-GUI-047" }
    comboArrowZone:   { alias: global.comboArrowZone,   note: "combo arrow zone, RQ-GUI-047" }
    comboLabelBorder: { alias: global.comboLabelBorder, note: "combo label border, RQ-GUI-047" }
    textHint:              { alias: global.caption, note: "muted settings hint lines (same muted grey as diagram captions), RQ-GUI-046" }
    progressBarHeight: { alias: global.space24, note: "ProgressWindow bar height" }
    controlRowHeight: { alias: global.controlRowHeight, note: "shared control-row height for stacked in-panel controls (BoundRadioGroup rows aligned with sibling check boxes)" }

  # -------------------------------------------------------------------
  # TIER 3 — COMPONENT : usages/transforms aliasing semantics. Only where a
  # transform or independent-movement potential exists; the effective accent
  # colour itself stays runtime-owned by XplorerLookAndFeel::ledColour()
  # (DEC-JUC-011) — these are the transform *parameters* applied to it.
  # -------------------------------------------------------------------
  component:
    knobRingHoverBrighten: { alias: semantic.hoverBrighten,   note: "accent.brighter(f) on hover" }
    tickBoxBorderAlpha:    { alias: global.tickBoxBorderAlpha, note: "accent.withAlpha(a) border" }
    knobTrackAlpha:        { alias: global.knobTrackAlpha,     note: "controlTrack.withAlpha(a)" }
    disabledAlpha:         { alias: global.disabledAlpha,      note: "shared control disabled treatment, ADR-JUC-017" }
    sectionBarFadeEnd:     { alias: global.sectionBarFadeEnd,  note: "block-colour section bar: opacity at the far end (bright at the label end), RQ-DSN-092" }
    sectionBarHeight:      { alias: global.sectionBarHeight,   note: "section separator bar thickness AND the label's baseline offset below the bar's top edge — the two are the same number because label and bar are bottom-aligned, RQ-GUI-062" }
    sectionLabelGap:       { alias: global.sectionLabelGap,    note: "gap on each side of a section label, RQ-GUI-062" }
    sectionLeadStub:       { alias: global.sectionLeadStub,    note: "lead-in rule drawn before a section label (silkscreen treatment), RQ-GUI-062" }
    sectionGapAbove:       { alias: global.sectionGapAbove,    note: "canvas px from a section lowest visible element down to its separator label baseline, RQ-CLR-001" }
    sectionGapBelowMin:    { alias: global.sectionGapBelowMin, note: "floor for the gap from a separator label baseline to the next section first element, RQ-CLR-002" }
    shortcutButtonSize:    { alias: global.shortcutButtonSize, note: "shortcut key side; spans the VFD together with shortcutButtonGap, RQ-GUI-065" }
    shortcutButtonGap:     { alias: global.shortcutButtonGap,  note: "gap between two shortcut keys, RQ-GUI-065" }
    shortcutButtonGapAbove: { alias: global.shortcutButtonGapAbove, note: "MIDI LED strip bottom -> key row top, RQ-GUI-065" }
    shortcutIconStroke:    { alias: global.shortcutIconStroke, note: "shortcut icon outline width, RQ-GUI-064" }
    shortcutButtonBorderAlpha: { alias: global.shortcutButtonBorderAlpha, note: "diagramFrame.withAlpha(a) for a key outline, RQ-GUI-063" }
    blockFillAlpha:        { alias: global.blockFillAlpha,     note: "blockColour.withAlpha(a) filled behind a labelled block, RQ-DSN-094" }
    blockFrameRelief:      { alias: global.blockFrameRelief,   note: "blockColour.darker(a) for the frame's bottom edge, RQ-DSN-094" }
    dialogIconAccent: { alias: global.dialogIconAccent, note: "title-bar icon badge colour, RQ-GUI-070" }
    dialogIconSize:   { alias: global.dialogIconSize,   note: "title-bar icon render size, RQ-GUI-070" }

    # ---- MIDI activity LED (RQ-GUI-056, ADR-JUC-031) ----
    # No semantic tier for these, same reasoning as the VFD group below: one
    # component's own geometry/photometry, not a role anything else shares.
    indicatorSize:       { alias: global.indicatorSize,       note: "MIDI LED lamp diameter, RQ-GUI-056" }
    indicatorGlowAlpha:  { alias: global.indicatorGlowAlpha,  note: "MIDI LED glow peak alpha, RQ-GUI-056" }
    indicatorGlowRadius: { alias: global.indicatorGlowRadius, note: "MIDI LED glow radius multiplier, RQ-GUI-056" }

    # ---- VFD 16-segment display (RQ-GUI-033, RQ-DSN-097, ADR-JUC-023) ----
    # No semantic tier for these: they are one component's geometry and
    # photometry, not roles anything else could share. Inventing a role that
    # exists to be aliased once would be tier ceremony, not design system.
    vfdPhosphor:     { alias: global.vfdPhosphor,   note: "lit segment / halo colour" }
    vfdSegLeft:      { alias: global.vfdSegLeft,    note: "segment rails, fractions of cell width" }
    vfdSegRight:     { alias: global.vfdSegRight }
    vfdSegTop:       { alias: global.vfdSegTop }
    vfdSegBottom:    { alias: global.vfdSegBottom,  note: "also the italic shear pivot" }
    vfdSegStroke:    { alias: global.vfdSegStroke }
    vfdSegGap:       { alias: global.vfdSegGap }
    vfdSegSlant:     { alias: global.vfdSegSlant }
    vfdGlowRadius:   { alias: global.vfdGlowRadius, note: "multiply by the render scale — DEC-JUC-053" }
    vfdGlowAmount:   { alias: global.vfdGlowAmount }
    vfdUnlitLevel:   { alias: global.vfdUnlitLevel }
    vfdWhiteLift:    { alias: global.vfdWhiteLift }
    vfdDotX:         { alias: global.vfdDotX,        note: "off-model primitives, DEC-JUC-052" }
    vfdDotSize:      { alias: global.vfdDotSize }
    vfdDotUpperY:    { alias: global.vfdDotUpperY }
    vfdDotLowerY:    { alias: global.vfdDotLowerY }
    vfdUnderscoreY:  { alias: global.vfdUnderscoreY }

    # ---- VFD bezel (RQ-GUI-050, RQ-DSN-098, ADR-JUC-024) ----
    # The band is the panel's own metal, INVERTED: the plate runs light at the
    # top and dark at the bottom, the bezel the other way round. Aliasing the
    # plate stops rather than restating their hex keeps that relationship
    # visible — if the panel material is ever retuned, the bezel follows.
    vfdBezelBandTop:     { alias: global.plateBot, note: "band gradient start (top) — the plate's DARK stop" }
    vfdBezelBandBottom:  { alias: global.plateTop, note: "band gradient end (bottom) — the plate's LIGHT stop" }
    vfdBezelMarginV:     { alias: global.vfdBezelMarginV }
    vfdBezelMarginH:     { alias: global.vfdBezelMarginH,     note: "thinner than MarginV on purpose, DEC-JUC-060" }
    vfdBezelInnerShadow: { alias: global.vfdBezelInnerShadow }
    vfdBezelInnerWidth:  { alias: global.vfdBezelInnerWidth }
    vfdBezelRimDark:     { alias: global.vfdBezelRimDark }
    vfdBezelRimLight:    { alias: global.vfdBezelRimLight }
